name: Desktop
# Instaladores de la mascota de escritorio para macOS, Windows y Linux.
on:
  push:
    tags: ['desktop-v*']
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - working-directory: desktop
        run: npm install
      - working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: moki-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.pacman
          if-no-files-found: warn
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
          body: |
            Moki · mascota de escritorio para macOS, Windows y Linux (incluye Omarchy/Hyprland).
            Instaladores sin firma de código: en macOS usa clic derecho → Abrir; en Windows «Más información → Ejecutar de todas formas».
            Guía: https://github.com/jorgefsb/moki-pixel/blob/main/desktop/README.md

            Hecho con amor ❤️🎮 por JorgeSuarez.com.mx
